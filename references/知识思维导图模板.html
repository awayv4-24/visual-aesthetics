<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识思维导图 · 模板</title>
<!--
  ============================================================
  知识思维导图模板（V0.1.6 · 苹果生态设计系统）
  用法：复制 → 替换 NODE 数据（下方 script 中）→ 保存交付。
  原则：只在"结构关系帮助理解"时使用；一图一引导一话口。
  ============================================================
-->
<style>
  :root{ --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --sub:#86868b;
         --accent:#0071e3; --line:#d2d2d7; --radius:16px; --shadow:0 4px 24px rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989d;
           --accent:#0a84ff; --line:#38383a; --shadow:0 4px 24px rgba(0,0,0,.5); } }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  body{background:var(--bg);color:var(--text);
       font:17px/1.65 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:36px 20px 80px}
  .kicker{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
  p.lede{color:var(--sub);font-size:16px;margin-bottom:8px}
  #map{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
       padding:24px;margin:20px 0;overflow-x:auto}
  svg{display:block;margin:0 auto}
  .edge{stroke:var(--line);stroke-width:1.5;fill:none}
  .node{cursor:pointer}
  .node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5;rx:12;transition:all .15s}
  .node.root rect{fill:var(--accent);stroke:var(--accent)}
  .node.root text{fill:#fff;font-weight:700}
  .node.sel rect{stroke:var(--accent);stroke-width:2.5}
  .node text{fill:var(--text);font-size:14.5px;font-weight:600;
             font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .node .sub{fill:var(--sub);font-size:12px;font-weight:400}
  #detail{display:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
          padding:22px 26px;border-left:4px solid var(--accent);margin:0 0 20px;font-size:16px}
  #detail.show{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  #detail h3{font-size:19px;margin-bottom:6px}
  #detail p{color:var(--text);margin:6px 0}
  #detail .src{color:var(--sub);font-size:13.5px;margin-top:10px}
  .foot{color:var(--sub);font-size:14px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">知识导图 · PHOTOGRAPHY</div>
  <h1 id="title"><!-- 占位：主题，如「临场判断的三块肌肉」--></h1>
  <p class="lede"><!-- 占位：一句引导语。点击任意节点查看讲解。--></p>

  <div id="detail"><h3 id="d-title"></h3><p id="d-body"></p><p class="src" id="d-src"></p></div>
  <div id="map"><svg id="svg" width="920" height="420"></svg></div>
  <p class="foot">点击节点展开讲解 · 一次只看一个分支，别贪多</p>
</div>

<script>
// ═══ 占位：导图数据（按需增删分支，建议 3–5 个一级分支）═══
const TITLE = "临场判断的三块肌肉";
const ROOT = "现场判断";
const NODES = [
  { id:"a", label:"预判", sub:"提前知道会发生什么", parent:"root",
    body:"来自节目单、走位、彩排、场地光线和你站的位置。这些都能提前准备——职业摄影师的果断，大半是信息前置，不是反应快。" },
  { id:"b", label:"决断", sub:"按下快门认出就是这张", parent:"root",
    body:"有明确判据：手势到顶、视线交汇、重心转移、表情完成、关系动作发生。判据能命名，就能练。" },
  { id:"c", label:"放弃", sub:"这个机位出不了片，走开", parent:"root",
    body:"最反直觉，也是职业与业余最明显的分界：不拍那些注定成不了的东西。你羡慕别人成片率高，很大程度来自这条。" },
];
// ═══ 渲染（横向树状：root 在左，分支向右展开）═══
const svg=document.getElementById('svg'), NS='http://www.w3.org/2000/svg';
document.getElementById('title').textContent=TITLE;
const H=420, n=NODES.length;
function el(t,attrs){const e=document.createElementNS(NS,t);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
// root
const rootG=el('g',{class:'node root'}), rw=150, rh=52, rx=30, ry=H/2-rh/2;
rootG.appendChild(el('rect',{x:rx,y:ry,width:rw,height:rh,rx:12}));
const rt=el('text',{x:rx+rw/2,y:H/2+5,'text-anchor':'middle'});rt.textContent=ROOT;rootG.appendChild(rt);
svg.appendChild(rootG);
const colW=230, boxW=180, boxH=64;
NODES.forEach((nd,i)=>{
  const gap=H/(n+1), cy=gap*(i+1);
  const bx=rx+rw+colW, by=cy-boxH/2;
  const edge=el('path',{class:'edge',d:`M ${rx+rw} ${H/2} C ${rx+rw+colW/2} ${H/2}, ${bx-colW/2} ${cy}, ${bx} ${cy}`});
  svg.appendChild(edge);
  const g=el('g',{class:'node','data-id':nd.id});
  g.appendChild(el('rect',{x:bx,y:by,width:boxW,height:boxH,rx:12}));
  const t1=el('text',{x:bx+16,y:by+27});t1.textContent=nd.label;g.appendChild(t1);
  if(nd.sub){const t2=el('text',{x:bx+16,y:by+47,class:'sub'});t2.textContent=nd.sub;g.appendChild(t2);}
  g.addEventListener('click',()=>{
    document.querySelectorAll('.node').forEach(x=>x.classList.remove('sel'));
    g.classList.add('sel');
    document.getElementById('d-title').textContent=nd.label;
    document.getElementById('d-body').textContent=nd.body||'';
    document.getElementById('d-src').textContent=nd.src||'';
    document.getElementById('detail').classList.add('show');
    document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  svg.appendChild(g);
});
svg.setAttribute('height',H);
svg.setAttribute('width',rx+rw+colW+boxW+30);
</script>
</body>
</html>
